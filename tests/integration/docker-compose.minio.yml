services:
  minio:
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"

  createbuckets:
    image: cgr.dev/chainguard/minio-client:latest-dev
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set myminio http://minio:9000 minioadmin minioadmin && mc ready myminio; do sleep 1; done;
      mc mb myminio/test-bucket;
      mc anonymous set public myminio/test-bucket;
      echo 'hello from s3' | mc pipe myminio/test-bucket/test-data/hello.txt;
      exit 0;
      "
