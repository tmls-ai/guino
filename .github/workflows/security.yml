name: Security
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '31 6 * * 1'
permissions:
  contents: read
jobs:
  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      matrix:
        include:
          - language: go
            build_mode: autobuild
          - language: javascript-typescript
            build_mode: none
          - language: python
            build_mode: none
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build_mode }}
      - uses: github/codeql-action/analyze@v3
        with:
          # Keep result identity stable when matrix build modes change.
          category: .github/workflows/security.yml:codeql/language:${{ matrix.language }}
