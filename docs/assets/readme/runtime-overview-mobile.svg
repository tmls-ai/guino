<svg xmlns="http://www.w3.org/2000/svg" width="440" height="600" viewBox="0 0 440 600" role="img" aria-labelledby="title desc">
  <title id="title">Guino runtime overview</title>
  <desc id="desc">Choose one entry point: MCP clients run guino mcp directly, while CLI and SDK clients connect to guino serve. Both use the engine to manage Docker sandboxes. One binary, eleven MCP tools, three SDKs. Build from source today. Docker required.</desc>
  <defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#B6F36B"/></marker></defs>
  <rect width="440" height="600" rx="20" fill="#0B0E10"/>
  <g font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="24" y="38" fill="#B6F36B" font-size="12" font-weight="700" letter-spacing="1.5">GUINO / CURRENT RUNTIME</text>
    <g fill="#F3F5F1" font-size="30" font-weight="650"><text x="24" y="85">A local runtime</text><text x="24" y="123">for your agent</text></g>
    <text x="24" y="158" fill="#AEB6BE" font-size="17">Choose one entry point.</text>
    <g fill="#151B20" stroke="#303941"><rect x="24" y="183" width="186" height="133" rx="12"/><rect x="230" y="183" width="186" height="133" rx="12"/><rect x="24" y="370" width="392" height="86" rx="12" stroke="#B6F36B"/></g>
    <g fill="#F3F5F1" font-size="19" font-weight="600"><text x="39" y="216">Your MCP client</text><text x="245" y="216">Your CLI or app</text></g>
    <g font-size="23" font-weight="650"><text x="39" y="259" fill="#B6F36B">guino mcp</text><text x="245" y="259" fill="#73CFFE">guino serve</text></g>
    <g fill="#AEB6BE" font-size="16"><text x="39" y="290">Direct engine</text><text x="245" y="290">HTTP / WebSocket</text></g>
    <g fill="none" stroke="#B6F36B" stroke-width="2"><path d="M117 316V342H220"/><path d="M323 316V342H220"/><path d="M220 342V356" marker-end="url(#arrow)"/></g>
    <text x="220" y="405" text-anchor="middle" fill="#F3F5F1" font-size="24" font-weight="600">Docker sandboxes</text>
    <text x="220" y="434" text-anchor="middle" fill="#AEB6BE" font-size="18">Commands and files</text>
    <g font-size="30" font-weight="650"><text x="24" y="508" fill="#B6F36B">1</text><text x="172" y="508" fill="#73CFFE">11</text><text x="330" y="508" fill="#FF9E52">3</text></g>
    <g fill="#F3F5F1" font-size="16"><text x="24" y="534">binary</text><text x="172" y="534">MCP tools</text><text x="330" y="534">SDKs</text></g>
    <text x="24" y="575" fill="#AEB6BE" font-size="15">Build from source today. Docker required.</text>
  </g>
</svg>
